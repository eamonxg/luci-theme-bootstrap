name: LuCI Theme Bootstrap Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      commit_ref:
        description: Commit, branch, or tag to build
        required: false
        type: string
      release:
        description: Set to true to create or update a release outside tag builds.
        required: false
        type: string
        default: "false"
      release_tag:
        description: Release tag to create or update. Leave empty to skip release.
        required: false
        type: string
  workflow_call:
    inputs:
      commit_ref:
        description: Commit, branch, or tag to build
        required: false
        type: string
      release:
        description: Set to true to create or update a release outside tag builds.
        required: false
        type: string
        default: "false"
      release_tag:
        description: Release tag to create or update. Leave empty to skip release.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build luci-theme-bootstrap ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["24.10.4", "25.12.5"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_ref || github.ref }}

      - name: Generate release body
        run: |
          COMMIT_AUTHOR=$(git show -s --format="Author: %an <%ae>")
          COMMIT_DATE=$(git show -s --date=iso-strict --format="Date: %cI")
          COMMIT_MESSAGE=$(git show -s --format="Message: %s")
          COMMIT_HASH=$(git show -s --format="Hash: %H")
          printf 'Latest commit:\n%s\n%s\n%s\n%s\n' "$COMMIT_AUTHOR" "$COMMIT_DATE" "$COMMIT_MESSAGE" "$COMMIT_HASH" > .release-body.md

      - id: slug
        run: echo "ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: eamonxg/build-luci-package@v2
        with:
          sdk: ${{ matrix.sdk }}
          packages: '[{"pkg":"luci-theme-bootstrap","path":"."}]'
      - uses: actions/upload-artifact@v6
        with:
          name: luci-theme-bootstrap-${{ steps.slug.outputs.ref }}-${{ steps.build.outputs.pkg_type }}
          path: out/*.[ai]pk
      - uses: eamonxg/build-luci-package/release@v2
        with:
          name: luci-theme-bootstrap
          files: out/*.[ai]pk
          body_path: .release-body.md
          release: ${{ inputs.release }}
          release_tag: ${{ inputs.release_tag }}
